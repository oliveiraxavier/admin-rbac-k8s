openapi: 3.0.3
info:
  title: Kubernetes Access Manager API
  version: 1.0.0
  description: API administrativa para gerenciar identidades, permissões RBAC e tokens temporários.
servers:
  - url: /
tags:
  - name: Health
  - name: Namespaces
  - name: Identities
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Verifica a disponibilidade do serviço
      security: []
      responses:
        '204':
          description: Serviço disponível
  /api/v1/namespaces:
    get:
      tags: [Namespaces]
      summary: Lista os namespaces permitidos
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Namespaces permitidos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/tokens:
    get:
      tags: [Identities]
      summary: Lista as identidades gerenciadas
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Identidades encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Identities]
      summary: Cria uma identidade e emite seu primeiro token
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdentityRequest'
      responses:
        '201':
          description: Identidade criada e token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/tokens/{namespace}/{name}:
    parameters:
      - name: namespace
        in: path
        required: true
        description: Namespace da ServiceAccount
        schema:
          type: string
      - name: name
        in: path
        required: true
        description: Nome da identidade
        schema:
          type: string
    put:
      tags: [Identities]
      summary: Atualiza permissões e namespaces de acesso
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIdentityRequest'
      responses:
        '200':
          description: Identidade atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Identities]
      summary: Exclui a identidade gerenciada e seus recursos RBAC
      security:
        - AdminBearerAuth: []
      responses:
        '204':
          description: Identidade excluída
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/tokens/{namespace}/{name}/issue:
    parameters:
      - name: namespace
        in: path
        required: true
        description: Namespace da ServiceAccount
        schema:
          type: string
      - name: name
        in: path
        required: true
        description: Nome da identidade
        schema:
          type: string
    post:
      tags: [Identities]
      summary: Emite um novo token para uma identidade existente
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTokenRequest'
      responses:
        '201':
          description: Novo token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    AdminBearerAuth:
      type: http
      scheme: bearer
      description: Segredo administrativo configurado em ADMIN_API_TOKEN.
  schemas:
    Permission:
      type: object
      required: [apiGroup, resource, verbs]
      properties:
        apiGroup:
          type: string
          description: Grupo da API Kubernetes; string vazia representa o grupo core.
          example: ''
        resource:
          type: string
          description: Recurso RBAC permitido.
          example: pods
        verbs:
          type: array
          minItems: 1
          items:
            type: string
            enum: [get, list, watch, create, delete]
        resourceNames:
          type: array
          description: Nomes específicos de Secrets. Quando informado, somente get é permitido.
          items:
            type: string
    Identity:
      type: object
      required: [name, namespace, namespaces, createdAt, permissions]
      properties:
        name:
          type: string
          example: dashboard-reader
        namespace:
          type: string
          description: Namespace da ServiceAccount.
          example: platform
        namespaces:
          type: array
          description: Namespaces nos quais as permissões RBAC são aplicadas.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    CreateIdentityRequest:
      type: object
      required: [name, namespace, targetNamespaces, permissions]
      properties:
        name:
          type: string
          maxLength: 50
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        namespace:
          type: string
        targetNamespaces:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        ttlSeconds:
          type: integer
          format: int64
          minimum: 600
          maximum: 31536000
          default: 31536000
        permissions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Permission'
    UpdateIdentityRequest:
      type: object
      required: [targetNamespaces, permissions]
      properties:
        targetNamespaces:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        permissions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Permission'
    IssueTokenRequest:
      type: object
      properties:
        ttlSeconds:
          type: integer
          format: int64
          minimum: 600
          maximum: 31536000
          default: 31536000
    IssuedToken:
      type: object
      required: [identity, token, expiresAt]
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        token:
          type: string
          description: Token bearer; exibido apenas na emissão.
        expiresAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Requisição inválida ou regra de validação não atendida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Segredo administrativo ausente ou inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Operação negada pela API Kubernetes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Identidade ou recurso gerenciado não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Recurso Kubernetes já existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Falha ao acessar a API Kubernetes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'