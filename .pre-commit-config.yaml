repos:
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-fmt-repo
        always_run: true
      - id: go-test-repo-mod
        always_run: true
      - id: go-vet-repo-mod
        always_run: true
      - id: golangci-lint-repo-mod
        always_run: true
